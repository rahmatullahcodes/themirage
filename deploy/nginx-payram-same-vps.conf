# Nginx Reverse Proxy for PayRam when running on the SAME VPS alongside The Mirage
# Prerequisites:
#   1. DNS A record: pay.themirage.world -> 189.105.33.15
#   2. Run PayRam container bound ONLY to loopback port 8090 (not host ports 80/443):
#        e.g. -p 127.0.0.1:8090:80
#   3. Copy this file to /etc/nginx/sites-available/pay-themirage, symlink to sites-enabled, reload nginx, then run Certbot:
#        sudo ln -s /etc/nginx/sites-available/pay-themirage /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#        sudo certbot --nginx -d pay.themirage.world

server {
    listen 80;
    listen [::]:80;

    server_name pay.themirage.world;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
